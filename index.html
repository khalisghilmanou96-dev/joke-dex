<head>

<title>JokeDex — JokeAPI</title>

<style>
:root{
  --bg:#10131b;
  --panel:#181d29;
  --line:#2d3548;
  --txt:#f8f5ff;
  --muted:#9ca7bb;
  --yellow:#ffd84d;
  --pink:#ff6eb4;
  --blue:#69c9ff
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:radial-gradient(circle at 80% 0,#54365d55,transparent 28%),var(--bg);
  color:var(--txt)
}

header{
  height:68px;
  padding:0 max(20px,5vw);
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  background:#10131be8;
  backdrop-filter:blur(14px);
  position:sticky;
  top:0;
  z-index:5
}

.logo{
  font-size:21px;
  font-weight:950
}

.logo b{
  color:var(--yellow)
}

.small{
  font-size:12px;
  color:var(--muted)
}

main{
  width:min(1100px,92vw);
  margin:auto
}

.hero{
  padding:72px 0 30px
}

.eyebrow{
  color:var(--pink);
  font-size:11px;
  font-weight:900;
  letter-spacing:.18em;
  text-transform:uppercase
}

h1{
  font-size:clamp(44px,7vw,78px);
  line-height:.95;
  margin:12px 0 16px;
  max-width:850px
}

.lead{
  color:var(--muted);
  line-height:1.6;
  max-width:680px
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr 150px;
  gap:10px;
  margin:28px 0
}

.controls select,
.controls button{
  padding:14px;
  border-radius:14px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--txt);
  font:inherit
}

.controls button{
  background:var(--yellow);
  color:#221d07;
  border:0;
  font-weight:950;
  cursor:pointer
}

.flags{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.flags label{
  background:#171c27;
  border:1px solid var(--line);
  border-radius:999px;
  padding:8px 11px;
  font-size:12px;
  color:var(--muted);
  cursor:pointer
}

.flags input{
  accent-color:var(--pink)
}

.status{
  margin:22px 0;
  color:var(--muted);
  font-size:13px
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  padding:22px;
  min-height:220px;
  display:flex;
  flex-direction:column
}

.meta{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.12em;
  font-weight:900;
  color:var(--blue)
}

.joke{
  font-size:20px;
  font-weight:850;
  line-height:1.4;
  margin:auto 0
}

.setup{
  font-size:18px;
  font-weight:850;
  line-height:1.4;
  margin-top:25px
}

.delivery{
  font-size:19px;
  color:var(--yellow);
  font-weight:900;
  line-height:1.4;
  margin:14px 0
}

.id{
  color:var(--muted);
  font-size:10px;
  margin-top:auto
}

.more{
  display:block;
  margin:28px auto 60px;
  padding:13px 22px;
  border-radius:13px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--txt);
  font-weight:900;
  cursor:pointer
}

/* PUBLICITÉS */
.ad-zone{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:28px auto;
  overflow:hidden;
}

.ad-desktop{
  display:block;
  max-width:728px;
}

.ad-mobile{
  display:none;
  max-width:320px;
}

.ad-square{
  min-height:250px;
}

footer{
  border-top:1px solid var(--line);
  padding:28px 0;
  color:var(--muted);
  font-size:12px
}

@media(max-width:720px){
  .grid{
    grid-template-columns:1fr
  }

  .controls{
    grid-template-columns:1fr
  }

  .ad-desktop{
    display:none
  }

  .ad-mobile{
    display:block
  }
}
</style>

<script>
const API="https://v2.jokeapi.dev/joke/";

const grid=document.querySelector("#grid"),
statusEl=document.querySelector("#status");

const go=document.querySelector("#go"),
more=document.querySelector("#more");

const esc=s=>String(s??"").replace(
  /[&<>"']/g,
  c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c])
);

async function requestJokes(url){

  const ctl=new AbortController();

  const timer=setTimeout(
    ()=>ctl.abort(),
    12000
  );

  try{

    const r=await fetch(
      url,
      {
        signal:ctl.signal,
        cache:"no-store"
      }
    );

    let d=null;

    try{
      d=await r.json();
    }catch(_){}

    if(!r.ok || d?.error)
      throw new Error(
        d?.message||("HTTP "+r.status)
      );

    return d;

  }finally{
    clearTimeout(timer)
  }
}


function makeUrl(cat,lang,useFlags=true){

  const params=new URLSearchParams();

  params.set("amount","10");
  params.set("lang",lang);
  params.append("safe-mode","");

  if(useFlags){

    const blacklist=[
      ...document.querySelectorAll(".flags input:checked")
    ]
    .map(x=>x.value)
    .join(",");

    if(blacklist)
      params.set("blacklistFlags",blacklist);
  }

  return API+
    encodeURIComponent(cat)+
    "?"+
    params.toString().replace(
      "safe-mode=",
      "safe-mode"
    );
}


function normalize(d){

  if(!d)return [];

  if(Array.isArray(d.jokes))
    return d.jokes;

  if(d.joke || d.setup)
    return [d];

  return [];
}


function render(jokes){

  grid.innerHTML="";

  for(const x of jokes){

    const c=document.createElement("article");

    c.className="card";

    c.innerHTML=`
      <div class="meta">
        <span>${esc(x.category||"Joke")}</span>
        <span>${x.safe?"SAFE":"JOKE"}</span>
      </div>

      ${
        x.type==="twopart"
        ?`
          <div class="setup">
            ${esc(x.setup||"")}
          </div>

          <div class="delivery">
            ${esc(x.delivery||"")}
          </div>
        `
        :`
          <div class="joke">
            ${esc(x.joke||"")}
          </div>
        `
      }

      <div class="id">
        Joke #${esc(x.id??"—")}
        ·
        ${esc((x.lang||"").toUpperCase())}
      </div>
    `;

    grid.appendChild(c);
  }
}


async function load(){

  const cat=document.querySelector("#cat").value;
  const lang=document.querySelector("#lang").value;

  statusEl.textContent=
    "Chargement des blagues…";

  go.disabled=true;
  more.disabled=true;

  try{

    let d,
    jokes=[];

    try{
      d=await requestJokes(
        makeUrl(cat,lang,true)
      );

      jokes=normalize(d);

    }catch(_){}

    if(!jokes.length){

      try{
        d=await requestJokes(
          makeUrl("Any",lang,false)
        );

        jokes=normalize(d);

      }catch(_){}
    }

    if(!jokes.length && lang!=="en"){

      d=await requestJokes(
        makeUrl("Any","en",false)
      );

      jokes=normalize(d);

      if(jokes.length){

        render(jokes);

        statusEl.textContent=
          "10 blagues chargées · aucune sélection suffisante en français, affichage anglais";

        return;
      }
    }

    if(!jokes.length)
      throw new Error(
        "Aucune blague disponible"
      );

    render(jokes);

    statusEl.textContent=
      jokes.length+" blagues chargées";

  }catch(e){

    statusEl.textContent=
      "JokeAPI ne répond pas pour le moment. Clique sur Générer pour réessayer.";

  }finally{

    go.disabled=false;
    more.disabled=false;
  }
}


go.onclick=load;
more.onclick=load;

load();
</script>
